
- name: install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true

- name: enable automatic security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-updates";
          "origin=Debian,codename=${distro_codename}-security";
      };

- name: install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: allow ssh
  community.general.ufw:
    rule: allow
    port: 22
    proto: tcp

- name: enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: add CrowdSec repository
  ansible.builtin.shell:
    cmd: curl -s https://install.crowdsec.net | sh
    creates: /etc/apt/sources.list.d/crowdsec_crowdsec.list

- name: install CrowdSec
  ansible.builtin.apt:
    name:
      - crowdsec
      - crowdsec-firewall-bouncer-iptables
    state: present
    update_cache: true

- name: Enable and start CrowdSec
  ansible.builtin.systemd:
    name: crowdsec
    enabled: true
    state: started

