- name: allow http
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: allow https
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

# ufw may be not enough
- name: allow deployer from docker network
  ansible.builtin.iptables:
    chain: INPUT
    source: 172.30.0.0/24
    destination: 172.30.0.1
    protocol: tcp
    destination_port: "3000"
    jump: ACCEPT
    action: insert
    rule_num: 1
    state: present

- name: Install CrowdSec Traefik collection
  ansible.builtin.command:
    cmd: cscli collections install crowdsecurity/traefik -o raw
  register: crowdsec_traefik_collection
  changed_when: "'Nothing to install' not in crowdsec_traefik_collection.stdout"

- name: Configure CrowdSec to acquire Traefik logs
  ansible.builtin.copy:
    src: traefik.yaml
    dest: /etc/crowdsec/acquis.d/traefik.yaml
  notify: restart crowdsec

